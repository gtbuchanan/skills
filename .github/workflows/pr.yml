---
# One run per pull request at a time, the older one cancelled. Without this,
# widening the trigger below multiplies what a stack costs rather than only
# what it covers: pushing to a member starts a full matrix beside the one
# already running, and the superseded run finishes anyway against a commit
# nobody is waiting on.
#
# Keyed on the pull request number rather than the branch, because a stacked
# member keeps its number when GitHub retargets it onto main — where its base,
# and so `github.ref`, changes underneath it.
#
# Cancelling is safe for every job here: each builds, checks or uploads for a
# single commit, and a cancelled upload leaves no partial report because the
# coverage merge feeding it never completes either.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}

jobs:
  ci:
    name: CI
    secrets: inherit
    # Runs turbo `build:ci`, whose `check` now depends on test:vitest:fast —
    # this is what puts the suite in front of a merge. e2e is off: the repo has
    # no e2e/ directory or vitest.config.e2e.ts for that job to run.
    # `check` covers the fast tier only, so the slow tier needs its own flag to
    # reach the gate at all.
    uses: gtbuchanan/tooling/.github/workflows/ci.yml@main
    with:
      run-e2e: false
      run-slow-tests: true

  eval-image:
    name: Eval Image
    # The one thing no other job exercises. `check` covers the packages and
    # the root; neither builds this image, and that gap let a broken one sit
    # behind green checks — declaring the first workspace glob made skills-npm
    # find skills it had no agent directory to deploy to, which fails the
    # build, and nothing noticed until someone rebuilt by hand.
    #
    # Unconditional rather than filtered on paths, because that break came
    # from pnpm-workspace.yaml rather than from the Dockerfile. A filter would
    # have to guess correctly at everything that can affect an image build,
    # and guessing wrong is the failure this job exists to catch.
    #
    # Builds only. Running a suite needs a real model and would spend budget
    # on every pull request, so `pnpm eval` and `pnpm eval:docker` stay
    # deliberate local acts — but a build alone catches this whole class,
    # since the image is where the dependency graph is resolved.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the eval image
        run: docker build --tag agent-skills-eval --file Dockerfile .

  pre-commit:
    name: Pre-Commit
    # The eslint step shells out to `pnpm exec`, so it needs node_modules.
    uses: gtbuchanan/tooling/.github/workflows/pre-commit.yml@main
    with:
      use-pnpm: true

name: PR

# Every pull request, not only the ones based on main. A stacked pull request
# is based on the branch below it, so a `branches: [main]` filter gave the
# whole stack no CI at all — every member below the top ran nothing until its
# parent merged and GitHub retargeted it, which is after review rather than
# before it. The cost is re-running these jobs on the same commits once a
# member is retargeted; the alternative was reviewing code no job had built.
on:
  pull_request: {}

permissions:
  contents: read
