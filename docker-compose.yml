# Local promptfoo results server + UI. Eval containers (run by
# scripts/run-evals-docker.ts) join the same network and `--share` their
# results here; browse them at http://localhost:3000.
#
# SQLite-backed and unauthenticated — local/trusted use only.
#
#   docker compose up -d      # start the server
#   docker compose down       # stop it (results persist in artifacts/promptfoo)
---
# Pinned, because everything below is named absolutely — the container, the
# network — while compose otherwise derives the project from the working
# directory. Every change here happens in a worktree, so the directory is
# never the same twice: a server started from one worktree belongs to a
# project the next one does not share, and compose then refuses the container
# name it finds already taken and warns that the network is not its own.
# Naming the project makes all of them the same run wherever it is invoked.
name: agent-skills-eval
networks:
  default:
    name: skills-eval-net
services:
  promptfoo-server:
    container_name: promptfoo-server
    image: ghcr.io/promptfoo/promptfoo:latest
    ports:
      - '3000:3000'
    restart: unless-stopped
    volumes:
      - ./artifacts/promptfoo:/home/promptfoo/.promptfoo
