# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Eval for this skill. Runs the REAL skill via claude-agent-sdk with `gt`
# shadowed by a fake answering as gt 2.0.0 against Forgejo 17.0.1 does
# (bin/gt-stub.ts). Each workspace is an empty directory, never a checkout,
# and gt holds a second login besides the Forgejo one.
#
# Each test targets a place where a gh-fluent agent goes wrong: a reply through
# a command Forgejo refuses, a job log read through `gt run view`, which cannot
# parse Forgejo's job list, and a login set up with a token rather than the
# agent-held key.

---
defaultTest:
  assert:
    - type: skill-used
      value: gtb-forgejo-gt
    - type: javascript
      value: file://src/gt-check.ts

  # Keep array vars intact instead of expanding each into separate test cases.
  options:
    disableVarExpansion: true
description: gtb-forgejo-gt — Forgejo through a fake gt

# Every agent call logs to a run of its own (see the run provider below), so
# distinct tests do not race. A test and its own `--repeat` runs share one
# workspace, so `--repeat` still needs `--max-concurrency 1`.
evaluateOptions:
  maxConcurrency: 3

extensions:
  - file://src/setup.ts:extensionHook

prompts:
  - |
    {{ context }}

    Run every command from ./scenarios/{{ scenario }}, relative to your working
    directory, and leave every other directory alone.

    {{ task }}

    When you are finished, briefly report what you did.

# The harness's run provider gives every test a run id, which reaches the
# double as STUB_RUN so each test's calls land in a log of their own. It runs
# the agent named here, with agentConfig as that agent's provider config.
providers:
  - config:
      agentConfig:
        apiKeyRequired: false
        append_allowed_tools:
          - 'Bash(gt:*)'
          - 'Read(scenarios/**)'
        ask_user_question:
          behavior: first_option

        path_to_claude_code_executable: '{{ env.CLAUDE_CODE_EXECUTABLE }}'
        setting_sources: ['project']
        skills: ['gtb-forgejo-gt']
        # Claude Code's own tool set. Without it promptfoo derives the tools
        # from the allowlist, and a scoped rule such as Bash(gt:*) is no tool
        # name, so the tool would be missing. The append_allowed_tools rules
        # still decide what runs without approval.
        tools: { preset: claude_code, type: preset }
        working_dir: '{{ env.EVAL_WORKSPACE }}'
    id: package:@gtbuchanan/promptfoo-agent-claude-code:RunProvider
    label: gtb-forgejo-gt
tests:
  - description: a reply lands in the thread through gt api, never through the refused commands
    vars:
      context: >-
        Our Forgejo is https://forgejo.example.com. gt is installed and logged
        in to it, and to gitea.com.
      expectReply: true
      forbidCalls:
        - ['pr review reply']
        - ['pr review resolve']
        - ['pr review unresolve']
        - ['/replies']
        - ['/resolve']
      requireHost: true
      scenario: reply-thread
      # Pre-approved, with the wording fixed: a run that stops to confirm is
      # answered by the harness's first option, which can be "hold off".
      task: >-
        The reviewer's comment on pull request 7 in acme/widgets says the retry
        loop retries forever on a 4xx. Reply on that thread with exactly "Fixed
        in 9f3c2ab." and resolve it. I have already approved posting, so go
        ahead without checking with me.
  - description: the failing job's log comes through gt api by run id, not gt run view
    vars:
      context: >-
        Our Forgejo is https://forgejo.example.com. gt is installed and logged
        in to it, and to gitea.com.
      forbidCalls:
        - ['run jobs']
        - ['run logs']
        - ['run view']
      reportIncludes: ['TestRetryStopsOn4xx']
      requireHost: true
      # Job 41 is reachable only through run 26, the id behind the "run 2" that
      # the check links show.
      requireOneOf:
        - ['api', 'actions/jobs/41/logs']
      scenario: run-logs
      task: >-
        CI is failing on pull request 7 in acme/widgets. Which test fails? Quote
        the failing line from its job's log.
  - description: the login uses the agent-held key, and no token passes through the run
    vars:
      context: >-
        Our Forgejo is https://forgejo.example.com. gt is installed and logged
        in to gitea.com, but not yet to our Forgejo. My SSH key is loaded in
        ssh-agent; its fingerprint is
        SHA256:q3Vn8bXo4fJt0wKcR2yLm7hDsE9aPzUgN6iTvB1xQ5M.
      forbidCalls:
        - ['--with-token']
        - ['auth token']
      requireHost: true
      requireOneOf:
        - [
            'auth login',
            '--ssh-agent-key',
            'SHA256:q3Vn8bXo4fJt0wKcR2yLm7hDsE9aPzUgN6iTvB1xQ5M',
          ]
      scenario: login-agent
      task: Set gt up so you can work with our Forgejo.
