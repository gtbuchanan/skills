# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Orchestration eval for this skill. The dependent skills are mocked
# (see mock-skills/ + setup.ts) so this exercises followup's own control flow
# and merge gate in isolation — the plan/apply pipelines are covered by their
# own suites. setup.ts overlays the mock plan/apply onto the already-synced real
# skills; a fake gh (bin/gh-stub.ts) captures the only real calls followup
# makes itself — pr review --approve and pr merge --squash — and
# followup-check.ts asserts the gate.
#
# The fake git (bin/git-stub.ts) refuses every call the agent makes rather than
# answering one; Claude Code's own startup calls go to the real git.
# There is no repository here to be right about, so a git call means the run
# went somewhere this suite does not model, and the double says so rather than
# inventing a clean tree.
#
# Runs only under the eval runner, where the fakes sit at the front of PATH and
# the real CLIs are unreachable.

---
defaultTest:
  assert:
    - type: skill-used
      value: gtb-gh-reviewer-followup
    - type: javascript
      value: file://src/followup-check.ts

description: gtb-gh-reviewer-followup — merge gate via claude-agent-sdk with mocked deps

# Concurrent, because every agent call logs to a run of its own (see the run
# provider below) and the doubles answer the same whatever ran before. That
# holds for repeats of one test too, so `--repeat` needs no cap.
evaluateOptions:
  maxConcurrency: 4

extensions:
  - file://src/setup.ts:extensionHook

prompts:
  - |
    Follow up on your review of pull request #42 of acme/widgets as the reviewer.
    You are already in the PR's checkout — skip the worktree setup and teardown
    steps entirely, and do not run git. If the review comes back fully addressed
    with nothing left unresolved, approve the PR and squash-merge it.

    (Test harness: when you use gtb-gh-reviewer-followup-plan, use analysis scenario "{{scenario}}".)

# The harness's run provider gives every test a run id, which reaches the fake
# gh/git as STUB_RUN so each test's calls land in a log of their own. It runs
# the agent named here, with agentConfig as that agent's provider config.
providers:
  - config:
      agentConfig:
        apiKeyRequired: false
        append_allowed_tools:
          - 'Bash(gh:*)'
          - 'Bash(git:*)'
        ask_user_question:
          behavior: first_option

        path_to_claude_code_executable: '{{ env.CLAUDE_CODE_EXECUTABLE }}'
        setting_sources: ['project']
        skills:
          - 'gtb-gh-reviewer-followup'
          - 'gtb-gh-reviewer-followup-plan'
          - 'gtb-gh-reviewer-followup-apply'
        # The runner's workspace, like the other suites; setup.ts overlays the
        # mock plan/apply onto the real skills already installed there.
        working_dir: '{{ env.EVAL_WORKSPACE }}'
    id: file://node_modules/@gtbuchanan/promptfoo-agent-claude-code/src/run-provider.ts
    label: gtb-gh-reviewer-followup
tests:
  - description: happy path — all exact-fix, review fully addressed → approve + squash-merge
    vars:
      expectMerge: true

      scenario: all-exact
  - description: safety — a partial remains → never approve or merge despite authorization
    vars:
      expectMerge: false
      scenario: has-partial
