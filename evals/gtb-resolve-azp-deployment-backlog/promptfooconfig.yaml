# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Behavioral eval for gtb-resolve-azp-deployment-backlog. Runs the REAL skill via
# claude-agent-sdk, but Azure DevOps is fully mocked: setup.ts overlays a Node
# stand-in onto the bundled PowerShell script (the harness admits no PowerShell)
# and the runner installs a fake `az` on PATH. The script stub logs
# each invocation to a per-pipeline file that backlog-check.ts asserts against —
# so this exercises the agent's decisions (resolve the pipeline id, dry-run
# first, and pass -ApproveLatest only when the newest should ship) without
# mutating a real pipeline. The checker also reads the agent's own report, to
# hold it to every handle the portal shows — pipeline name, run names, and the
# link to the run that shipped — rather than bare definition and build ids. The
# pipeline names and ids are fictional so a stray real call could not target an
# actual definition.
#
# Parallel-safe: every test uses a distinct pipeline id, so each writes to its
# own log file (….runs/script-<id>.jsonl) with no shared state, and the auth-fail
# case is triggered by a sentinel id (900911) rather than a per-test env var.
# The tests therefore run concurrently.
#
# Runs only under the eval runner, where the doubles are installed and the real
# az/PowerShell are unreachable.
#
# The skill's confirm-before-live-run interaction stays human-verified (like
# gtb-pr-review-apply's confirmation gate): the prompt pre-grants approval so the
# agent proceeds past the -WhatIf preview, and the checker asserts the dry-run
# ordering rather than the interactive prompt itself.

---
defaultTest:
  assert:
    # The skill must actually be invoked — not a coincidentally-right answer.
    - type: skill-used
      value: gtb-resolve-azp-deployment-backlog
    - type: javascript
      value: file://backlog-check.ts

description: gtb-resolve-azp-deployment-backlog — behavior via claude-agent-sdk with a mocked az + script

# Parallel: each test keys its own log file by a unique pipeline id and the
# auth-fail case uses a sentinel id, so there is no shared mutable state.
evaluateOptions:
  maxConcurrency: 4

extensions:
  - file://setup.ts:extensionHook

prompts:
  - |
    {{userMessage}}

    (Test harness — you are in a Linux eval container. Azure DevOps is mocked:
    `az` and the bundled script are test doubles, so no real pipeline is
    touched. Target organization example-org, project default-project. The
    script is directly executable here — invoke it exactly as the skill
    documents, e.g.
    `<skill-dir>/scripts/resolve-azp-deployment-backlog.ps1 -PipelineId N
    -Organization example-org -Project default-project -WhatIf`; do NOT prefix
    it with `pwsh`. The user has already approved this
    run, so after your -WhatIf preview, proceed with the live command — pass
    -Confirm:$false so it does not block on the interactive gate.)

providers:
  - config:
      # Authenticate via the local Claude Code session instead of an API key.
      apiKeyRequired: false
      # Sealed harness (mocked az, no reachable PowerShell), so the skill can
      # freely run its bundled script and `az`. Scoping Bash to fixed prefixes
      # would fight the variable skill-dir path the agent resolves the script by.
      append_allowed_tools:
        - 'Bash'
      ask_user_question:
        behavior: first_option

      path_to_claude_code_executable: '{{ env.CLAUDE_CODE_EXECUTABLE }}'
      setting_sources: ['project']
      skills: ['gtb-resolve-azp-deployment-backlog']
      working_dir: '{{ env.EVAL_WORKSPACE }}'
    id: anthropic:claude-agent-sdk
    label: gtb-resolve-azp-deployment-backlog
tests:
  - description: named pipeline, approve the newest — resolve web-frontend→900001, dry-run, then live -ApproveLatest
    vars:
      approveLatest: true
      expectLiveRun: true
      expectPipelineName: web-frontend
      expectRunNames: ['2026.5.99']
      expectRunUrl: https://dev.azure.com/example-org/default-project/_build/results?buildId=900999
      pipelineId: 900001
      userMessage: >-
        i've got like 15 main builds piled up at the cd approval gate for the
        web-frontend pipeline in azp. reject everything but the newest and
        approve the newest.
  - description: explicit id, leave newest manual — -PipelineId 900003, no -ApproveLatest
    vars:
      approveLatest: false
      expectLiveRun: true
      # payments-api appears nowhere but the stub's output, so unlike the two
      # named-pipeline tests this one proves the agent actually read it.
      expectPipelineName: payments-api
      expectRunNames: ['2026.5.99']
      expectRunUrl: https://dev.azure.com/example-org/default-project/_build/results?buildId=900999
      pipelineId: 900003
      userMessage: >-
        clear the pending approval backlog on azp pipeline 900003 / main, leave
        the newest for me to approve manually
  - description: informal 'fast-forward' phrasing — resolve api-service→900002, live -ApproveLatest
    vars:
      approveLatest: true
      expectLiveRun: true
      expectPipelineName: api-service
      expectRunNames: ['2026.5.99']
      expectRunUrl: https://dev.azure.com/example-org/default-project/_build/results?buildId=900999
      pipelineId: 900002
      userMessage: >-
        fast-forward the deploy queue on api-service — only the latest commit
        should ship
  - description: first-run auth failure — surface the one-time az login --scope fix
    vars:
      expectAuthFix: true
      expectLiveRun: false
      pipelineId: 900911
      userMessage: >-
        use the gtb-resolve-azp-deployment-backlog skill against pipeline 900911,
        dry-run only
