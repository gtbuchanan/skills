# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# Tests the REAL pr-review-verdict skill (no duplicated rubric) via promptfoo's
# claude-agent-sdk provider, following
# https://www.promptfoo.dev/docs/guides/test-agent-skills/
#
# The provider discovers the skill from .claude/skills/ under working_dir
# (repo root), runs it as an agent against file fixtures, and `skill-used`
# confirms the skill actually fired. apiKeyRequired: false authenticates through
# the local Claude Code session — no ANTHROPIC_API_KEY.
#
# Run from the repo root:
#   pnpm eval                     # all skills
#   pnpm eval pr-review-verdict   # just this one
#   pnpm eval pr-review-verdict --repeat 3   # sample nondeterminism

---
defaultTest:
  assert:
    # The skill must actually be invoked — not a coincidentally-right answer.
    - type: skill-used
      value: pr-review-verdict
    # Verdict correctness + reply presence (empty iff exact-fix).
    - type: javascript
      value: file://verdict-check.ts

  options:
    # Grade the reply-quality rubric through the same keyless agent SDK.
    #
    # custom_system_prompt REPLACES the provider's default `claude_code` preset
    # (see its systemPrompt resolution: custom_system_prompt short-circuits the
    # preset). That swap is load-bearing, not cosmetic. promptfoo hands the
    # grader its rubric as a SERIALIZED chat array — a JSON string of
    # role/system + role/user messages — which the agent SDK does not unpack, so
    # it arrives as one user turn. Wearing the coding-assistant persona, the
    # model would sometimes respond ABOUT that blob ("the rubric evaluates a
    # grader output, not a task for me") instead of grading it, and when it
    # skipped the JSON entirely the assertion died on "Could not extract JSON
    # from llm-rubric response" — a flake that failed the suite while the skill
    # under test was fine. Casting the grader as a JSON-only program removes the
    # persona that was arguing with the prompt.
    #
    # The prompt keeps an explicit escape hatch for the ungradeable case. A
    # grader forced to always emit a verdict has no way left to say "I could not
    # evaluate this" — the old flake signalled that loudly, if only by accident,
    # and silently resolving those to a pass or fail would trade a noisy suite
    # for a quietly wrong one. Routing that answer through pass:false keeps the
    # signal without breaking the parser.
    provider:
      config:
        apiKeyRequired: false
        custom_system_prompt: >-
          You are an automated grading program, not a conversational assistant.
          Your input is a serialized chat array containing a grading system
          message, a model output in <Output> tags, and a rubric in <Rubric>
          tags; treat that system message as your instructions rather than as
          text to comment on. Judge only whether the output satisfies the
          rubric. Respond with exactly one JSON object and nothing else:
          {"reason": string, "pass": boolean, "score": number}. A parser reads
          your response, so any prose outside that object — including remarks
          about the request itself — is a failed grade.
          If the rubric genuinely cannot be evaluated against the output —
          the output is malformed, or the rubric does not apply to what you
          were given — report that inside the contract: return pass false with
          a reason naming the obstacle. Being unable to grade something is a
          real result worth recording, so do not paper over it by guessing a
          verdict, and do not escape the format to explain yourself.
        path_to_claude_code_executable: '{{ env.CLAUDE_CODE_EXECUTABLE }}'
      id: anthropic:claude-agent-sdk
description: pr-review-verdict — real skill via claude-agent-sdk against fixtures

prompts:
  - |
    Follow up on a pull request review as the reviewer. Read the open review
    threads in {{fixture}}/threads.json and the diff since your last review in
    {{fixture}}/changes.diff. For each thread, decide whether the diff addressed
    the concern — exact-fix, partial, or unaddressed — citing the specific hunk
    as evidence, and draft a reviewer reply for any thread that is not an exact
    fix. Return the JSON array the skill specifies.

providers:
  - config:
      # Authenticate via the local Claude Code session instead of an API key.
      apiKeyRequired: false
      append_allowed_tools:
        - 'Read(evals/pr-review-verdict/fixtures/**)'

      path_to_claude_code_executable: '{{ env.CLAUDE_CODE_EXECUTABLE }}'
      setting_sources: ['project']
      skills: ['pr-review-verdict']
      working_dir: '{{ env.EVAL_WORKSPACE }}'
    id: anthropic:claude-agent-sdk
    label: pr-review-verdict
tests:
  - description: exact-fix — constant-time comparison
    vars:
      expectedVerdict: exact-fix

      fixture: evals/pr-review-verdict/fixtures/exact-fix-constant-time
  - description: exact-fix — magic number extracted to a named constant
    vars:
      expectedVerdict: exact-fix

      fixture: evals/pr-review-verdict/fixtures/exact-fix-magic-number
  - assert:
      - type: llm-rubric
        value: >-
          In the JSON output, the `reply` field is a specific, collegial
          reviewer reply that points at the still-unguarded notify_batch call
          site and does not claim the concern is fully resolved.

    description: partial — notify guarded but notify_batch still dereferences null
    vars:
      expectedVerdict: partial
      fixture: evals/pr-review-verdict/fixtures/partial-batch-path
  - assert:
      - type: llm-rubric
        value: >-
          In the JSON output, the `reply` field is a specific, collegial
          reviewer reply that flags the new problem the fix introduced (draining
          the whole pool rather than releasing the connection) and does not
          claim the concern is fully resolved.

    description: partial — try/finally added but drains the pool instead of releasing the conn
    vars:
      expectedVerdict: partial
      fixture: evals/pr-review-verdict/fixtures/partial-pool-drain
  - assert:
      - type: llm-rubric
        value: >-
          In the JSON output, the `reply` field is a specific, collegial
          reviewer reply noting the null dereference is still present despite
          the signature change, and does not claim the concern is resolved.

    description: unaddressed — type hints added but the flagged null deref remains
    vars:
      expectedVerdict: unaddressed
      fixture: evals/pr-review-verdict/fixtures/unaddressed-type-hints
  - assert:
      - type: llm-rubric
        value: >-
          In the JSON output, the `reply` field is a specific, collegial
          reviewer reply noting the debounce was not addressed (nothing in
          ui/form.tsx changed) and does not claim the concern is resolved.

    description: unaddressed — concern is in ui/form.tsx, diff only touches ui/header.tsx
    vars:
      expectedVerdict: unaddressed
      fixture: evals/pr-review-verdict/fixtures/unaddressed-wrong-file
  # Exact-fix trap: the flagged line was rewritten (renamed var, template
  # literal) so a naive judge might call it fixed, but user input is still
  # interpolated into the SQL — the injection concern is fully intact. Exercises
  # the rubric's "a line merely moving/renaming is NOT enough" bias.
  - assert:
      - type: llm-rubric
        value: >-
          In the JSON output, the `reply` field is a specific, collegial
          reviewer reply noting the query still interpolates user input (the
          rewrite to a template literal did not parameterize it) and does not
          claim the concern is resolved.

    description: unaddressed — SQL line rewritten cosmetically but still injectable
    vars:
      expectedVerdict: unaddressed
      fixture: evals/pr-review-verdict/fixtures/unaddressed-cosmetic-rewrite
  # Multiple threads in one input, mixed verdicts — verifies the skill classifies
  # and echoes every thread by id, not just the first. verdict-check.ts scores
  # each thread in the expectedVerdicts map.
  - description: multi-thread — exact-fix, partial, and unaddressed together
    vars:
      expectedVerdicts:
        T-auth: exact-fix
        T-form: unaddressed
        T-user: partial
      fixture: evals/pr-review-verdict/fixtures/multi-thread-mixed
