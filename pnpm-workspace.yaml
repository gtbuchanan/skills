allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@anthropic-ai/claude-agent-sdk': 0.3.316
  '@faker-js/faker': 10.6.0
  '@gtbuchanan/cli': 2.0.0
  '@gtbuchanan/eslint-config': 0.6.0
  '@gtbuchanan/tsconfig': 0.2.0
  '@gtbuchanan/vitest-config': 0.3.0
  # libsql ships prebuilt bindings for darwin/linux/win32 only, so promptfoo
  # cannot open its eval database on Termux — the whole run dies before the
  # first test. Aliasing the binding libsql looks for on this target to a
  # node:sqlite-backed stand-in fixes that. Declared optional, and the shim
  # itself is `os: [android]`, so every other platform skips it and keeps the
  # real binding.
  '@libsql/android-arm64': npm:@gtbuchanan/libsql-termux-shim@0.1.1
  '@types/cross-spawn': 6.0.6
  '@types/node': 26.6.6
  '@types/which': 3.0.4
  '@vitest/coverage-v8': 5.1.0
  cross-spawn: 7.0.6
  eslint: 10.14.0
  find-up-simple: 1.0.1
  graphql: 17.0.2
  jiti: 2.7.0
  promptfoo: 0.125.1
  skills: 1.7.5
  skills-npm: 4.1.0
  turbo: 2.11.10
  typescript: 7.0.2
  valibot: 1.5.0
  vitest: 5.1.0
  which: 7.0.0
  yaml: 2.9.1

engineStrict: true

hoist: false

lockfileIncludeTarballUrl: false

# 3 days, in minutes.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gtbuchanan/*'

packages:
  - evals/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    # Transitive mismatches in promptfoo's tree for features we don't exercise.
    mongodb>gcp-metadata: '8 || 9'
    nunjucks>chokidar: '5'

strictPeerDependencies: true
