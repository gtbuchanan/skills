allowBuilds:
  '@playwright/browser-chromium': false
  '@swc/core': false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

catalog:
  '@anthropic-ai/claude-agent-sdk': 0.3.226
  '@gtbuchanan/cli': 0.6.0
  '@gtbuchanan/eslint-config': 0.5.1
  '@gtbuchanan/tsconfig': 0.2.0
  '@gtbuchanan/vitest-config': 0.1.3
  # libsql ships prebuilt bindings for darwin/linux/win32 only, so promptfoo
  # cannot open its eval database on Termux — the whole run dies before the
  # first test. Aliasing the binding libsql looks for on this target to a
  # node:sqlite-backed stand-in fixes that. Declared optional, and the shim
  # itself is `os: [android]`, so every other platform skips it and keeps the
  # real binding.
  '@libsql/android-arm64': npm:@gtbuchanan/libsql-termux-shim@0.1.1
  '@pnpm/lockfile.types': 1100.0.19
  '@types/cross-spawn': 6.0.6
  '@types/node': 26.4.1
  '@vitest/coverage-v8': 4.1.10
  cross-spawn: 7.0.6
  eslint: 10.8.1
  find-up-simple: 1.0.1
  jiti: 2.7.0
  promptfoo: 0.122.0
  skills: 1.5.22
  skills-npm: 1.2.0
  turbo: 2.10.9
  typescript: 6.0.3
  valibot: 1.4.2
  vitest: 4.1.10
  yaml: 2.9.0

engineStrict: true

hoist: false

lockfileIncludeTarballUrl: false

# 3 days, in minutes.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gtbuchanan/*'

packages:
  - evals/*
  - packages/*

peerDependencyRules:
  allowedVersions:
    # Transitive mismatches in promptfoo's tree for features we don't exercise.
    mongodb>gcp-metadata: '8'
    nunjucks>chokidar: '5'

strictPeerDependencies: true
